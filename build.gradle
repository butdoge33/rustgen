plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Runs tests under Fabric Loader (Knot) so our mixins/accessors are applied.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// ---------------------------------------------------------------------------
// Native (Rust) library
// Builds native/ with cargo for the host plus any cross targets, and packages each at
// /natives/<platform>/<file> inside the mod jar. NativeLib.java extracts and loads the
// one matching the running platform (or falls back to vanilla if there is none).
//
// Cross targets: -Prustgen.crossTargets=windows-x86_64 (comma-separated; default below).
//   windows-x86_64: rustup target add x86_64-pc-windows-gnu + gcc-mingw-w64-x86-64.
// ---------------------------------------------------------------------------
def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
def osArch = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
def nativeOs = osName.contains("win") ? "windows" : (osName.contains("mac") ? "macos" : "linux")
def nativeArch = (osArch == "amd64" || osArch == "x86_64") ? "x86_64" : osArch
def hostPlatform = "${nativeOs}-${nativeArch}"
def nativeOutDir = layout.buildDirectory.dir("generated/natives")

// platform -> [rust target triple (null = host), library file name]
def nativeTargets = [
	"linux-x86_64"  : ["x86_64-unknown-linux-gnu", "librustgen.so"],
	"windows-x86_64": ["x86_64-pc-windows-gnu", "rustgen.dll"],
	"macos-x86_64"  : ["x86_64-apple-darwin", "librustgen.dylib"],
	"macos-aarch64" : ["aarch64-apple-darwin", "librustgen.dylib"],
]
def requested = (findProperty("rustgen.crossTargets") ?: (hostPlatform == "linux-x86_64" ? "windows-x86_64" : ""))
		.toString().split(",").collect { it.trim() }.findAll { it && it != hostPlatform }
def platforms = [hostPlatform] + requested

def cargoTasks = platforms.collect { platform ->
	def (triple, libName) = nativeTargets[platform] ?: [null, null]
	if (libName == null) throw new GradleException("Unknown native platform '${platform}'")
	def host = platform == hostPlatform
	def libPath = host ? "native/target/release/${libName}" : "native/target/${triple}/release/${libName}"
	def task = tasks.register("cargoBuild-${platform}", Exec) {
		group = "build"
		description = "Builds the Rust native library for ${platform} (release)."
		workingDir = file("native")
		commandLine(host ? ["cargo", "build", "--release"] : ["cargo", "build", "--release", "--target", triple])
		inputs.dir("native/src")
		inputs.file("native/Cargo.toml")
		outputs.file(libPath)
	}
	[platform: platform, task: task, lib: libPath]
}

def copyNatives = tasks.register("copyNatives", Copy) {
	cargoTasks.each { t -> dependsOn t.task }
	into(nativeOutDir)
	cargoTasks.each { t ->
		from(t.lib) { into("natives/${t.platform}") }
	}
}

sourceSets.main.resources.srcDir(copyNatives)
// Binaries don't belong in the sources jar.
tasks.matching { it.name == "sourcesJar" }.configureEach { exclude("natives/**") }

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "failed", "skipped"
		exceptionFormat "full"
		showStandardStreams = true
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

// ---------------------------------------------------------------------------
// Verification / benchmark servers (see rustgen.debug.PregenHarness).
// Same seed and area; one native, one vanilla. Compare the rustgen-pregen.txt files.
//   ./gradlew runPregenNative runPregenVanilla
// ---------------------------------------------------------------------------
loom {
	runs {
		pregenNative {
			server()
			configName = "Pregen (native)"
			runDir = "run/pregen-native"
			vmArgs "-Xmx2G", "-Drustgen.pregen=12", "-Drustgen.hashFills=true"
			programArgs "nogui"
		}
		pregenVanilla {
			server()
			configName = "Pregen (vanilla)"
			runDir = "run/pregen-vanilla"
			vmArgs "-Xmx2G", "-Drustgen.pregen=12", "-Drustgen.hashFills=true", "-Drustgen.disable=true"
			programArgs "nogui"
		}
	}
}

// Benchmark servers run on Java 21 (closest available to 1.18.2's Java 17), not on the
// JDK running Gradle.
tasks.matching { it.name.startsWith("runPregen") }.configureEach {
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
