[package]
name = "rustgen"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Keep unwinding so panics can be caught and turned into Java exceptions
# instead of killing the game.
panic = "unwind"
