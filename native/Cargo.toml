[package]
name = "rustgen"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
md-5 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Keep unwinding so panics can be caught and turned into Java exceptions
# instead of killing the game.
panic = "unwind"
# Smaller library; JNI entry points stay in the dynamic symbol / export table.
strip = "symbols"

[features]
# Phase timers for chunk fills (corners / block densities / materials / surface scans),
# printed by examples/bench.rs. Compiled out of normal builds.
profile = []

[dev-dependencies]
# Sampling profiler for examples/bench.rs (SIGPROF-based; no perf/root needed). Not shipped.
pprof = { version = "0.15", features = ["flamegraph"] }
